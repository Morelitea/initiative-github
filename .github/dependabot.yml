# Watch this repository's dependencies for published advisories.
#
# Without this file the repository is not watched, and "not watched" reads
# the same as "nothing found": an alert count of zero is what both look like
# from the outside. Three repositories in this organisation had alerts off
# entirely and answered 403 to anything that asked.
#
# Grouped and on a weekly cadence deliberately. One pull request a week that
# a person reads beats five a day that nobody does, and an update nobody
# merges is not an update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The workflows are a dependency too: an unpinned or outdated Action is a
  # supply-chain surface that no package manifest mentions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
