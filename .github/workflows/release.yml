name: Release

# Cutting a release is one deliberate action: pushing a `vX.Y.Z` tag. Nothing a
# push to `main` can do stages or triggers one, which is why the version is not
# written down anywhere on `main` — the tag IS the version, and it is passed
# through to the image below. A file carrying the next version instead means an
# ordinary feature commit can bump the release, and a reader cannot tell what is
# released from what is merely staged.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Keyless signing: cosign exchanges this OIDC token for a short-lived
  # certificate from Fulcio, so no private key exists to hold or to leak.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The tag is the version, so the only thing to check is that it is one.
      # A mistyped tag would otherwise publish an image nothing can resolve and
      # move `latest` to it.
      - name: Check the tag is a version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      # Stamped from the tag rather than carried on main, for the same reason
      # the catalog files are: a version written down on main lets an ordinary
      # commit stage a release, and lets the two drift apart.
      - name: Stamp the version
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/morelitea/initiative-github
          # A chart tracking :latest gets the newest release; a deployment that
          # wants to pin has the exact version and the major.minor line.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7

        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing this organization publishes was signed, so nothing downstream
      # could tell an image this workflow built from one someone else pushed to
      # the same tag. initiative_infra's PLAN.md records that signing has to
      # start in the app repos' publish workflows before Kyverno can verify
      # anything — the admission policy is blocked on this, not the reverse.
      #
      # Keyless: cosign exchanges the job's OIDC token for a short-lived
      # certificate and records the signature in the public Rekor log. No
      # private key exists to hold, rotate or lose, and the certificate carries
      # the workflow identity — so a verifier can require that this repository's
      # release workflow produced the image, rather than merely someone with
      # push access to the registry.
      #
      # Signed by digest, not tag: a tag moves, a digest is what was built. One
      # signature covers every tag pointing at it.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$TAGS" | head -n1 | cut -d: -f1)"
          cosign sign --yes "${image}@${DIGEST}"
          echo "signed ${image}@${DIGEST}"

      # The catalog files, stamped with the tag. An operator publishes this app
      # by dropping them into their MARKETPLACE_EXTRA_CATALOG_DIR, so they ship
      # attached to the release rather than committed: the tag is the version,
      # and a listing carrying one on `main` would let an ordinary commit stage
      # a release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run catalog
        env:
          LISTING_VERSION: ${{ steps.version.outputs.value }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: catalog/*.json
