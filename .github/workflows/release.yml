name: Release

# Cutting a release is one deliberate action: pushing a `vX.Y.Z` tag. Nothing a
# push to `main` can do stages or triggers one, which is why the version is not
# written down anywhere on `main` — the tag IS the version, and it is passed
# through to the image below. A file carrying the next version instead means an
# ordinary feature commit can bump the release, and a reader cannot tell what is
# released from what is merely staged.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the version, so the only thing to check is that it is one.
      # A mistyped tag would otherwise publish an image nothing can resolve and
      # move `latest` to it.
      - name: Check the tag is a version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      # Stamped from the tag rather than carried on main, for the same reason
      # the catalog files are: a version written down on main lets an ordinary
      # commit stage a release, and lets the two drift apart.
      - name: Stamp the version
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/morelitea/initiative-github
          # A chart tracking :latest gets the newest release; a deployment that
          # wants to pin has the exact version and the major.minor line.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The catalog files, stamped with the tag. An operator publishes this app
      # by dropping them into their MARKETPLACE_EXTRA_CATALOG_DIR, so they ship
      # attached to the release rather than committed: the tag is the version,
      # and a listing carrying one on `main` would let an ordinary commit stage
      # a release.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run catalog
        env:
          LISTING_VERSION: ${{ steps.version.outputs.value }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: catalog/*.json
