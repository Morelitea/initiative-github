name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: initiative_github_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/initiative_github_test
      - run: npm run test:command
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/initiative_github_test
      # The manifest has to build, which validates it — a manifest a deployment
      # would refuse should never reach a commit.
      - run: npm run manifest
      # And so do the listings. An invalid one is *skipped* during a catalog
      # rescan and named in a log nobody is reading, which leaves the app
      # registered, healthy and absent from the marketplace. This is the last
      # place that is loud.
      - run: npm run catalog
      # And the GitHub App registration. It is the half no deployment checks —
      # an operator fills it in once from what this prints, and nothing fetches
      # it afterwards to notice it stopped matching.
      - run: npm run github-app
        env:
          APP_PUBLIC_URL: https://github-app.example.com

  image:
    # Keep this context stable: main requires the literal "Image builds" check.
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Built on every change, not only on a tag: a Dockerfile that only breaks
      # at release time breaks when it is least convenient.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: initiative-github:scan
      # Scan the image loaded by the build step above, so the verdict covers
      # the exact runtime artifact this PR produces rather than its source tree.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: initiative-github:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
